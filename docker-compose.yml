name: project-quarry

# Local development stack for Project Quarry.
#
#   postgres      - the platform metadata store (quarry_metadata schema:
#                    pipeline_runs / watermarks / dataset_catalog /
#                    lineage_edges) AND the local-dev "warehouse" stand-in
#                    for Redshift (raw.sales_orders + dbt's staging/
#                    intermediate/mart schemas). See
#                    libs/metadata_client/schema.sql.
#   metadata-api  - FastAPI service exposing GET /pipelines/{name}/runs and
#                    GET /catalog over the postgres service above.
#   airflow       - single-container `airflow standalone` (webserver +
#                    scheduler + triggerer) running
#                    airflow/dags/sales_orders_pipeline.py. Keeps Airflow's own
#                    state (DAG runs, task instances, users) in a dedicated
#                    `airflow` database on the postgres service above, rather
#                    than the SQLite file it would otherwise default to.
#                    MWAA/RDS plays this role in real environments.
#
# Run: docker compose up --build
# Airflow UI: http://localhost:8080 — get the generated admin password with
#   `docker compose exec airflow cat /opt/airflow/standalone_admin_password.txt`
#   (standalone also prints it on first boot, but that log line does not
#   survive a container restart; the file does).
# metadata-api: http://localhost:8000/docs
#
# Host ports are overridable so this stack can coexist with other local
# projects already bound to 5432/8000/8080 — set POSTGRES_PORT,
# METADATA_API_PORT and/or AIRFLOW_PORT in .env or the shell.

services:
  postgres:
    image: postgres:16-alpine
    container_name: quarry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quarry_admin
      POSTGRES_PASSWORD: quarry_dev_password
      POSTGRES_DB: quarry_metadata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - quarry_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init/00_create_airflow_db.sql:/docker-entrypoint-initdb.d/00_create_airflow_db.sql:ro
      - ./libs/metadata_client/schema.sql:/docker-entrypoint-initdb.d/01_quarry_metadata_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quarry_admin -d quarry_metadata"]
      interval: 5s
      timeout: 5s
      retries: 10

  metadata-api:
    build:
      context: ./metadata-api
      dockerfile: Dockerfile
    container_name: quarry-metadata-api
    restart: unless-stopped
    environment:
      METADATA_DATABASE_URL: "postgresql+psycopg2://quarry_admin:quarry_dev_password@postgres:5432/quarry_metadata"
    ports:
      - "${METADATA_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  airflow:
    image: apache/airflow:2.9.3-python3.11
    container_name: quarry-airflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # Airflow's OWN metadata DB (its DAG runs, task instances, users) on the
      # postgres service, in a dedicated `airflow` database created by
      # docker/postgres-init/00_create_airflow_db.sql. Left unset, `airflow
      # standalone` falls back to a SQLite file with SequentialExecutor, which
      # serializes every task and is explicitly not meant for concurrent
      # access by scheduler + triggerer + webserver. Postgres also permits a
      # real executor, so tasks no longer run strictly one at a time.
      #
      # NOTE: this is NOT the fix for the webserver failing to start ("No
      # response from gunicorn master within N seconds"). That was initially
      # blamed on SQLite lock contention; moving to Postgres did not resolve
      # it. The measured cost is Airflow's process startup (~21s of CPU for a
      # no-op `airflow config get-value`, mostly filesystem syscalls) while the
      # database sits idle. See README finding 9 - still open.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://quarry_admin:quarry_dev_password@postgres:5432/airflow"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # Generous because Airflow's boot is slow on Docker Desktop for
      # Windows/macOS. These raise the deadline the webserver monitor enforces;
      # they are a mitigation, not a fix (see README finding 9). If the UI
      # still will not start, reduce load on the host.
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "300"
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "300"
      AIRFLOW__WEBSERVER__WORKERS: "2"
      METADATA_DATABASE_URL: "postgresql+psycopg2://quarry_admin:quarry_dev_password@postgres:5432/quarry_metadata"
      WAREHOUSE_DATABASE_URL: "postgresql+psycopg2://quarry_admin:quarry_dev_password@postgres:5432/quarry_metadata"
      # Consumed by dbt/profiles.yml.example env_var() lookups. Without
      # these, dbt inside this container would dial localhost:5432.
      WAREHOUSE_HOST: postgres
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_USER: quarry_admin
      WAREHOUSE_PASSWORD: quarry_dev_password
      WAREHOUSE_DB: quarry_metadata
      WAREHOUSE_SCHEMA: analytics
      RAW_ZONE_PATH: /opt/airflow/data-lake/raw
      CLEAN_ZONE_PATH: /opt/airflow/data-lake/clean
      CURATED_ZONE_PATH: /opt/airflow/data-lake/curated
      SALES_ORDERS_SOURCE_CSV: /opt/airflow/sample-data/sales_orders.csv
      DBT_PROFILES_DIR: /opt/airflow/dbt
      DBT_PROJECT_DIR: /opt/airflow/dbt
      DBT_EXECUTABLE: /opt/airflow/dbt-venv/bin/dbt
      PYTHONPATH: /opt/airflow/libs
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/requirements.txt:/opt/airflow/requirements-airflow.txt:ro
      - ./libs:/opt/airflow/libs
      - ./dbt:/opt/airflow/dbt
      - ./sample-data:/opt/airflow/sample-data
      - ./data-lake:/opt/airflow/data-lake
      - quarry_airflow_home:/opt/airflow
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    # PID 1 is `bash -c` below, and bash does not reap orphaned children or
    # forward signals. Without an init, any stray background process inside the
    # container can leave an unreapable zombie, after which Docker refuses to
    # stop the container at all ("PID N is zombie and can not be killed") and it
    # has to be force-removed. tini costs nothing and makes the container
    # behave.
    init: true
    entrypoint: ["/bin/bash", "-c"]
    command:
      # dbt goes in its own venv rather than alongside Airflow: the two pin
      # conflicting versions of jinja2/attrs, and trigger_dbt_run shells out to
      # the CLI anyway (DBT_EXECUTABLE above points at it). The venv lives on
      # the quarry_airflow_home volume, so it is built once, not every boot.
      - >
        pip install --no-cache-dir
        -r /opt/airflow/requirements-airflow.txt
        -r /opt/airflow/libs/metadata_client/requirements.txt
        -r /opt/airflow/libs/dq_checks/requirements.txt &&
        if [ ! -x /opt/airflow/dbt-venv/bin/dbt ]; then
        python -m venv /opt/airflow/dbt-venv &&
        /opt/airflow/dbt-venv/bin/pip install --no-cache-dir
        -r /opt/airflow/dbt/requirements.txt;
        fi &&
        cp -n /opt/airflow/dbt/profiles.yml.example /opt/airflow/dbt/profiles.yml &&
        airflow standalone

volumes:
  quarry_postgres_data:
  quarry_airflow_home:
