version: 2

models:
  - name: stg_sales_orders
    description: Typed, renamed sales order line items sourced from raw.sales_orders.
    columns:
      - name: order_id
        description: Natural key for a sales order line item.
        tests:
          - not_null
          - unique
      - name: customer_id
        description: Foreign key to stg_customers.
        # Deliberately warn-level, not error: the platform tolerates a
        # bounded null rate on this column. The hard gate is the DAG's
        # dq_gate task (check_null_rate on customer_id, threshold
        # SALES_ORDERS_NULL_RATE_THRESHOLD, default 10%), which fails the
        # run above that. Staging preserves source fidelity, so an
        # error-level not_null here would fail dbt test on data the
        # pipeline is specified to accept. The relationships test below
        # still enforces FK validity for non-null values.
        tests:
          - not_null:
              config:
                severity: warn
      - name: order_date
        tests:
          - not_null
      - name: order_amount
        tests:
          - not_null
      - name: order_status
        tests:
          - accepted_values:
              arguments:
                values: ["COMPLETED", "PENDING", "CANCELLED"]

  - name: stg_customers
    description: Distinct customers derived from raw.sales_orders (single-source vertical slice).
    columns:
      - name: customer_id
        description: Natural key for a customer.
        tests:
          - not_null
          - unique
